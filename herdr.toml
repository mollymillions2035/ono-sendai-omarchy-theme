# Ono-Sendai for Herdr, the terminal app. Herdr has no theme files, so this is
# the [theme] block of ~/.config/herdr/config.toml: paste it in over the one
# that's there. The desktop app's theme is herdr-desktop.json.
#
# The base is "terminal" so pane contents and anything not named here follow
# the terminal's own palette. Every token Herdr draws its chrome with is set
# to a fixed colour, because on the terminal palette the sidebar divider is
# ANSI black, which is this theme's background.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
# Active tab, focused pane border. Overrides [ui] accent.
accent = "#e8261b"

# Tab bar and sidebar keep the terminal's background, so a translucent
# terminal stays translucent there. Any colour here, even the terminal's own
# background, is drawn opaque.
panel_bg = "reset"
sidebar_bg = "reset"

# The line between the sidebar and the panes and the rule between the
# sidebar's sections. With panel_bg reset it is also the active tab's label,
# so it has to read on the accent and still show on the background: black
# does the first and not the second.
surface_dim = "#4d1a15"

# Sidebar: the active space's row, and the cursor row when navigating
active_row_bg = "#3b1411"
selection_bg = "#4d1a15"

# Inactive tabs
surface0 = "#160e0d"
surface1 = "#241615"

# Unfocused pane dividers, inactive tab labels, sidebar headings
overlay0 = "#64504b"
# The new-tab "+" and the right of the tab bar
overlay1 = "#b8a8a3"

text = "#e6d9d4"
subtext0 = "#b8a8a3"

# Status colours. red is the bright red so that a blocked agent doesn't read
# as plain accent.
red = "#ff5a4c"
green = "#8ab36f"
yellow = "#e3b24f"
blue = "#7489c4"
teal = "#5fb0aa"
mauve = "#cf5a86"
peach = "#ee6a2c"
